<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>CINDERCAST</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      /* The canvas fills the viewport; the 320x240 look comes from the
         internal render target, not from a small canvas. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto; /* linear upscale is done in-shader */
      }
      #hint {
        position: fixed;
        left: 8px;
        bottom: 6px;
        font: 11px/1.4 monospace;
        color: #B7B2A8;
        opacity: 0.5;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hint">[F] toggle 320&times;240 / 640&times;480</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
